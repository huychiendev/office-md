<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office to Markdown Converter PRO</title>
    <!-- Tailwind CSS & Modern Typography -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Local Static Vendor Libraries (Zero Server Load - Offline Capable) -->
    <script src="libs/exceljs.min.js"></script>
    <script src="libs/mammoth.browser.min.js"></script>
    <script src="libs/jszip.min.js"></script>
    <script src="libs/pdf.min.js"></script>
    <script src="libs/marked.min.js"></script>
    <script src="libs/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    
    <script>
        // Use local PDF.js worker
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'libs/pdf.worker.min.js';
        }
        if (window.mermaid) {
            mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 40%, #030712 100%);
            color: #f8fafc;
            height: 100vh;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .drag-active {
            border-color: #8b5cf6 !important;
            background: rgba(139, 92, 246, 0.15) !important;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.25);
        }
        .markdown-body {
            color: #e2e8f0;
            line-height: 1.65;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: #f8fafc;
            margin-top: 1.2em;
            margin-bottom: 0.4em;
            font-weight: 600;
        }
        .markdown-body h1 { font-size: 1.8em; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.3em; }
        .markdown-body h2 { font-size: 1.4em; }
        .markdown-body a { color: #a78bfa; text-decoration: underline; text-underline-offset: 3px; }
        .markdown-body img { max-width: 100%; border-radius: 8px; margin: 1em 0; border: 1px solid rgba(255,255,255,0.1); }
        .markdown-body pre { background: #070b14; padding: 1.1em; border-radius: 10px; overflow-x: auto; border: 1px solid rgba(255,255,255,0.06); }
        .markdown-body code { font-family: 'JetBrains Mono', monospace; background: rgba(255,255,255,0.08); padding: 0.2em 0.45em; border-radius: 5px; font-size: 0.88em; }
        .markdown-body pre code { background: transparent; padding: 0; }
        .markdown-body blockquote { border-left: 4px solid #8b5cf6; margin: 0; padding-left: 1em; color: #94a3b8; font-style: italic; }
        
        .excel-table-wrap { overflow-x: auto; margin-bottom: 24px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.2); }
        .excel-table { border-collapse: collapse; width: 100%; min-width: 650px; font-size: 13px; }
        .excel-table th { border: 1px solid rgba(255,255,255,0.1); padding: 6px 10px; text-align: center; font-weight: 600; background-color: rgba(255,255,255,0.06); color: #cbd5e1; }
        .excel-table td { border: 1px solid rgba(255,255,255,0.08); padding: 6px 10px; vertical-align: top; white-space: pre-wrap; }
        .excel-table .row-idx { font-weight: 600; background-color: rgba(255,255,255,0.04); text-align: center; width: 45px; color: #94a3b8; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.15); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body class="p-3 md:p-6 flex flex-col h-screen select-none">
    
    <!-- Full Width 100% Container -->
    <div class="w-full h-full flex flex-col">
        <!-- Main Top Bar & Dropzone (Full Width) -->
        <header class="glass-card rounded-2xl p-4 mb-4 flex flex-col lg:flex-row justify-between items-center gap-4 border-2 border-slate-700/60 transition-all relative shadow-xl w-full" id="dropzone">
            <input type="file" id="fileInput" class="hidden" accept=".pptx,.pptm,.potx,.docx,.docm,.xlsx,.xlsm,.xltx,.xltm,.pdf,.html,.htm,.csv,.json,.xml,.txt">
            <input type="file" id="folderInput" class="hidden" webkitdirectory directory multiple>
            
            <!-- Logo, Title & Engine Status Badge -->
            <div class="flex items-center gap-3 shrink-0 w-full lg:w-auto">
                <div class="p-2.5 bg-gradient-to-br from-violet-600 to-indigo-600 rounded-xl shadow-lg shadow-violet-500/25">
                    <i data-lucide="zap" class="text-white w-5 h-5"></i>
                </div>
            </div>

            <!-- Upload / Converting Status -->
            <div class="flex items-center gap-3 flex-1 min-w-0 w-full lg:w-auto px-2" id="uploadState">
                <div class="bg-slate-800/90 p-2 rounded-xl border border-slate-700/50" id="stateIcon">
                    <i data-lucide="upload-cloud" class="w-5 h-5 text-violet-400"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <h3 class="text-xs font-semibold text-slate-200 truncate" id="stateTitle">Kéo thả file hoặc thư mục vào đây</h3>
                    <p class="text-slate-400 text-[11px] truncate" id="stateDesc">Hỗ trợ Excel (công thức & màu), PPTX (ảnh), Word, PDF, CSV, VBA...</p>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="flex flex-wrap sm:flex-nowrap items-center gap-2.5 shrink-0 w-full lg:w-auto justify-end">
                <label class="flex items-center gap-1.5 cursor-pointer text-xs text-slate-300 hover:text-white transition-colors bg-slate-800/60 hover:bg-slate-800 px-2.5 py-1.5 rounded-lg border border-slate-700/60">
                    <input type="checkbox" id="chkExcludeHidden" class="w-3.5 h-3.5 rounded border-slate-600 text-violet-600 focus:ring-violet-500 bg-slate-900">
                    <span>Bỏ sheet ẩn</span>
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer text-xs text-slate-300 hover:text-white transition-colors bg-slate-800/60 hover:bg-slate-800 px-2.5 py-1.5 rounded-lg border border-slate-700/60">
                    <input type="checkbox" id="chkLimitRows" class="w-3.5 h-3.5 rounded border-slate-600 text-violet-600 focus:ring-violet-500 bg-slate-900">
                    <span>Rút gọn (100 dòng)</span>
                </label>
                
                <div class="flex gap-2">
                    <button onclick="document.getElementById('folderInput').click()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg transition-colors flex items-center gap-1.5 border border-slate-700 shadow-sm">
                        <i data-lucide="folder-up" class="w-3.5 h-3.5"></i> Thư mục
                    </button>
                    <button onclick="document.getElementById('fileInput').click()" class="px-4 py-1.5 bg-violet-600 hover:bg-violet-500 text-white text-xs font-medium rounded-lg transition-colors flex items-center gap-1.5 shadow-md shadow-violet-600/25">
                        <i data-lucide="file-up" class="w-3.5 h-3.5"></i> Chọn File
                    </button>
                </div>
            </div>
        </header>

        <!-- Workspace Container (Full Width & Height) -->
        <main class="flex-1 flex flex-col min-h-0 w-full">
            <div class="w-full h-full glass-card rounded-2xl flex flex-col overflow-hidden relative border border-slate-800 shadow-2xl">
                <!-- Toolbar -->
                <div class="border-b border-slate-800 p-3 flex justify-between items-center bg-slate-950/40">
                    <div class="flex gap-1.5 bg-slate-950/70 p-1 rounded-lg border border-slate-800">
                        <button id="btnPreview" class="px-3 py-1 text-xs font-medium rounded-md bg-violet-600 text-white transition-all shadow-sm">Preview HTML</button>
                        <button id="btnCode" class="px-3 py-1 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200 transition-all">Markdown Raw</button>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <button id="btnCopy" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-medium text-slate-200 transition-colors disabled:opacity-40 disabled:cursor-not-allowed border border-slate-700/60" disabled>
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i> <span>Sao chép</span>
                        </button>
                        <button id="btnDownload" class="flex items-center gap-1.5 px-3.5 py-1.5 bg-violet-600 hover:bg-violet-500 rounded-lg text-xs font-medium text-white transition-colors disabled:opacity-40 disabled:cursor-not-allowed shadow-md shadow-violet-600/25" disabled>
                            <i data-lucide="download" class="w-3.5 h-3.5"></i> <span id="btnDownloadText">Tải xuống</span>
                        </button>
                    </div>
                </div>

                <!-- Main Content Display -->
                <div class="flex-1 flex overflow-hidden relative">
                    <!-- Batch File Sidebar -->
                    <div id="fileSidebar" class="w-72 border-r border-slate-800 bg-slate-950/50 overflow-y-auto hidden flex-col">
                        <div class="p-3 border-b border-slate-800/80 text-[11px] font-semibold text-slate-400 uppercase tracking-wider flex justify-between items-center">
                            <span>Danh sách File</span>
                            <span id="batchCountBadge" class="bg-violet-500/20 text-violet-300 px-1.5 py-0.5 rounded text-[10px]">0</span>
                        </div>
                        <div id="fileList" class="flex flex-col p-2 gap-1"></div>
                    </div>

                    <!-- Viewport Area (Full Width) -->
                    <div class="flex-1 overflow-auto p-6 relative select-text" id="viewportContainer">
                        <!-- Empty Placeholder -->
                        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500">
                            <div class="p-4 bg-slate-900/60 rounded-2xl border border-slate-800 mb-3 shadow-inner">
                                <i data-lucide="file-code-2" class="w-10 h-10 text-violet-400/60"></i>
                            </div>
                            <p class="text-sm font-medium text-slate-300">Kéo thả file hoặc chọn tài liệu để bắt đầu</p>
                        </div>

                        <!-- Render Views -->
                        <div id="previewArea" class="markdown-body hidden w-full h-full"></div>
                        <textarea id="codeArea" class="w-full h-full bg-transparent border-none resize-none focus:ring-0 text-xs font-mono text-slate-300 hidden" readonly></textarea>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Core Application Logic -->
    <script src="script.js"></script>
</body>
</html>
